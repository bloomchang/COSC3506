<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talent Discovery</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f5f7fb;
      color: #17243a;
      font-family: system-ui, sans-serif;
      line-height: 1.6;
    }
    header { background: #17243a; color: white; padding: 1rem; }
    nav, main { max-width: 1100px; margin: auto; }
    nav { display: flex; flex-wrap: wrap; gap: 1rem; }
    nav a { color: white; }
    main { padding: 1.5rem 1rem 3rem; }
    h1, h2, h3 { line-height: 1.25; }
    a { color: #174bb8; overflow-wrap: anywhere; }
    button, input, textarea { font: inherit; max-width: 100%; }
    button, .button {
      display: inline-block;
      background: #174bb8;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: .65rem 1rem;
      cursor: pointer;
      text-decoration: none;
    }
    button.secondary { background: #e7edf8; color: #17243a; }
    input:not([type="checkbox"]), textarea {
      width: 100%;
      padding: .7rem;
      border: 1px solid #68778d;
      border-radius: 6px;
    }
    textarea { min-height: 130px; }
    label { display: block; }
    fieldset {
      border: 1px solid #c1ccdb;
      border-radius: 8px;
      margin: 1rem 0;
      min-width: 0;
    }
    legend { font-weight: 650; }
    .choices { display: flex; flex-wrap: wrap; gap: .5rem 1.2rem; }
    .choices label { display: flex; gap: .4rem; align-items: center; }
    input[type="checkbox"] { width: 18px; height: 18px; }
    .panel, .card {
      background: white;
      border: 1px solid #d4dce8;
      padding: 1.25rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
    }
    .grid .card { margin: 0; }
    .tags { display: flex; flex-wrap: wrap; gap: .4rem; }
    .tag {
      background: #edf2fa;
      color: #253b60;
      border-radius: 6px;
      padding: .2rem .55rem;
      font-size: .9rem;
    }
    .muted { color: #52627a; }
    .actions { display: flex; flex-wrap: wrap; gap: .6rem; }
    .field { margin-bottom: 1rem; }
    :focus-visible { outline: 3px solid #c45c00; outline-offset: 4px; }
    .skip {
      position: absolute;
      top: -100px;
      background: white;
      padding: .5rem;
    }
    .skip:focus { top: 0; }
    @media (max-width: 450px) {
      .grid { grid-template-columns: 1fr; }
      .panel, .card { padding: 1rem; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header>
    <nav aria-label="Main navigation">
      <a href="/">Talent Discovery</a>
      <a href="/items">Phase 0 Items</a>
    </nav>
  </header>
  <main id="main" tabindex="-1">
    <div id="app">Loading…</div>
  </main>
  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
